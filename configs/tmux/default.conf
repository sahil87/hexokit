# run-kit tmux configuration
# Canonical source — copied to app/backend/build/tmux.conf at build time,
# embedded in the binary, and written to ~/.config/hexokit/tmux.conf as the
# rk-managed config (hash-stamped header; do not edit the managed file).

# --- General ---
# Never reap a server when its session count hits zero. run-kit holds a hidden
# `_rk-ctl` anchor floor on every server it manages, but this option is the
# belt-and-suspenders backstop for the brief restart/reconnect window where the
# anchor is momentarily absent. tmux's default (exit-empty on) destroys the whole
# server — taking live agent sessions with it — the instant the last session
# closes (Constitution VI). See change 260602-a1wo-prevent-exit-empty-server-death.
set -g exit-empty off
set -g default-terminal "tmux-256color"
set -g mouse on
set -g escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
# Unnamed windows auto-name to their folder (basename of the active pane's
# current path), live-updating on cd — not the running command (tmux's default
# #{pane_current_command}). automatic-rename itself defaults to on; only the
# format changes. Windows created with an explicit -n stay pinned.
set -g automatic-rename-format '#{b:pane_current_path}'


# --- Prefix (Ctrl+S — avoids Ctrl+B conflict with Claude Code) ---
unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# --- TUI compatibility ---
# Synchronized output — eliminates flicker in TUI apps
set -gq allow-passthrough on
set -as terminal-features ',xterm-256color:sync'

# Modifier key combos (Ctrl+Shift+key etc.) in TUI apps
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Report extended keys in kitty CSI-u form — what crossterm/kitty-protocol
# TUIs (Kimi Code, neovim, helix, fish 4) expect; tmux's default xterm form
# breaks their modifier decoding. -q: no-op on tmux < 3.5.
set -gq extended-keys-format csi-u

# OSC 52 clipboard — works across relay and nested tmux
set -g set-clipboard on

# Focus events — proper TUI focus tracking
set -g focus-events on

# True color (xterm-256color is the TERM used by the relay)
set -ag terminal-overrides ",xterm-256color:RGB:Tc"

# --- Status bar (themed via ANSI colour indices) ---
set -g status on
set -g status-style "bg=colour0,fg=colour7"
set -g status-left " #[fg=colour4,bold]#S #[default]"
set -g status-left-length 30
set -g status-right " #[fg=colour7]%H:%M "
set -g status-right-length 40

# Window list styling
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour15,bg=colour4,bold] #I:#W #[default]"
set -g window-status-separator ""

# --- Pane borders ---
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

# Pane status bar — shows command, path, git branch, worktree badge
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[bg=colour4#,fg=colour15#,bold]  #{?#{e|>:#{window_panes},1},#P · ,}#{@rk_pane_pathtail} #[bg=colour3#,fg=colour15#,bold]#{@rk_pane_git_worktree}#[bg=colour8#,fg=colour7#,bold]  #{@rk_pane_git_branch} #[bg=colour2#,fg=colour7] #{pane_current_command} ,#[fg=colour8]  #{?#{e|>:#{window_panes},1},#P · ,}#{@rk_pane_pathtail} }'

# --- Multi-viewer sizing ---
# A window is never wider than the narrowest client currently viewing it. This is
# a correctness guard, not a preference: every released tmux through 3.7c
# underflows the pane-border-status draw width (screen-redraw.c,
# screen_redraw_draw_pane_status: `width = size - x` in u_int) when a viewer is
# narrower than the window and a pane status line straddles its edge, and the
# resulting ~4-billion-cell tty_draw_line spins the whole server ~21s per redraw.
# `smallest` makes that geometry unreachable. aggressive-resize scopes the
# constraint to clients whose CURRENT window is the one being sized, so a
# grouped _rk-pin-* viewer of another window does not shrink this one.
set -g window-size smallest
setw -g aggressive-resize on

# --- Keybindings (byobu-style) ---
bind -n F2 new-window
bind -n F3 previous-window
bind -n F4 next-window

# Pane management
bind \\ split-window -h
bind - split-window -v
bind -n S-F3 select-pane -t :.-
bind -n S-F4 select-pane -t :.+

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind -n S-F7 copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- User extensions (drop-in configs) ---
# Place *.conf files in ~/.config/hexokit/tmux.d/ to extend this config
# (user.conf is the conventional home; rk scaffolds it and never overwrites).
# Files are sourced in lexicographic order (use numeric prefixes for control).
# The if-shell mirrors the config-home resolution rule at load time: hexokit
# when it exists (or on a fresh install), else the legacy ~/.config/run-kit
# dir for one release — so a conf rewritten on an unmigrated install still
# picks up its overrides. Exactly one dir is ever sourced.
if-shell '[ -d "$HOME/.config/hexokit" ] || [ ! -d "$HOME/.config/run-kit" ]' 'source-file -q ~/.config/hexokit/tmux.d/*.conf' 'source-file -q ~/.config/run-kit/tmux.d/*.conf'
