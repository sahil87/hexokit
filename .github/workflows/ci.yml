name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes), but never
# cancel main — every merged commit gets a full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/backend/go.mod

      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3

      # internal/sessions integration tests shell out to fab + tmux. fab is not
      # available on the runner, so those cases t.Skip — the rest still run.
      - name: Install tmux
        # apt has no network timeout by default — a stalled mirror connection
        # (the recurring azure.archive.ubuntu.com flake) hangs this step until
        # the 360-minute job timeout. Bound the step and give apt explicit
        # fetch timeouts + retries so a mirror stall fails in minutes and a
        # re-run recovers.
        timeout-minutes: 5
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y tmux

      - name: Run backend tests
        run: just test-backend

      # The api package owns the SSE hub's concurrency surface — gate it under
      # the race detector.
      - name: Run api package tests under -race
        run: just test-backend-race

  frontend:
    name: Frontend (vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          package_json_file: app/frontend/package.json

      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3

      - name: Install frontend dependencies
        run: cd app/frontend && pnpm install --frozen-lockfile

      - name: Type-check
        run: cd app/frontend && npx tsc --noEmit

      - name: Run frontend unit tests
        run: just test-frontend

  code-bridge:
    name: Code bridge (tsc + node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # app/code-bridge has no packageManager field — pin pnpm via the
      # frontend manifest like the other pnpm jobs.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          package_json_file: app/frontend/package.json

      - name: Install code bridge dependencies
        run: cd app/code-bridge && pnpm install --frozen-lockfile

      - name: Type-check
        run: cd app/code-bridge && npx tsc --noEmit

      - name: Run code bridge tests
        run: cd app/code-bridge && pnpm test

  e2e:
    name: E2E (shard ${{ matrix.shard }}/4)
    # Pinned below ubuntu-latest: that label now resolves to Ubuntu 26.04, where
    # the Playwright in app/frontend (1.59.1) refuses to install chromium and its
    # system deps (`Playwright does not support chromium on ubuntu26.04-x64`),
    # failing `just setup` before any test runs. Move back to ubuntu-latest
    # when the Playwright pin supports the newer image.
    runs-on: ubuntu-24.04
    # Blocking gate (since 260602-a1wo). The e2e suite is SSE-driven and shares
    # two rigs per shard; under a 4-vCPU runner's contention a
    # rotating subset of tests can lose the timing race (the flaky set is
    # non-deterministic). Readiness gates (see tests/e2e/_ready.ts) reduce this,
    # and proper de-flaking (deterministic polls / optimistic-aware waits) is a
    # tracked follow-up. E2E is now a required dependency of the `ci-gate` job,
    # so a failing/flaky shard blocks merge — admin bypass on the main ruleset
    # is the intended escape hatch for known-flake overrides.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/backend/go.mod

      # pnpm must be installed before setup-node so its `cache: pnpm` can
      # resolve the store path.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          package_json_file: app/frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3

      # The e2e harness runs against live dev servers: tmux backs the sessions,
      # the Go backend and Vite serve the app. Each shard is its own runner
      # with its own /tmp/tmux-* socket dir, so every shard derives the same
      # per-worktree e2e identity (rk-test-e2e-<token>-*, scripts/e2e-env.sh)
      # in an isolated VM. Inside a shard, RK_E2E_WORKERS (below) has the
      # harness start that many complete rigs — one tmux sub-family + backend
      # + Vite per Playwright worker — so a shard runs two spec files at once
      # without the SSE cross-talk a shared rig would cause.
      - name: Runner shape
        # RK_E2E_WORKERS below is sized to the runner's vCPU count (4 on the
        # public-repo ubuntu-latest); this keeps the real shape visible in the
        # log so a runner change is noticed rather than felt as flakes.
        run: |
          echo "vCPUs: $(nproc)"
          free -g
      - name: Install tmux
        # apt has no network timeout by default — a stalled mirror connection
        # (the recurring azure.archive.ubuntu.com flake) hangs this step until
        # the 360-minute job timeout. Bound the step and give apt explicit
        # fetch timeouts + retries so a mirror stall fails in minutes and a
        # re-run recovers.
        timeout-minutes: 5
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y tmux

      # The air binary only changes when its pinned version does — cache it to
      # skip the ~17s source build. Bump the key together with the version in
      # the install step below.
      - name: Cache air binary
        id: cache-air
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin/air
          key: air-v1.61.7-${{ runner.os }}

      - name: Install air (backend live-reload used by `just dev`)
        if: steps.cache-air.outputs.cache-hit != 'true'
        run: |
          # Pin to the last air release that targets go 1.23 (the repo's
          # toolchain). @latest pulls a build requiring go >= 1.25, which
          # silently triggers a toolchain download and drifts from go.mod.
          go install github.com/air-verse/air@v1.61.7

      - name: Add go bin dir to PATH
        # Ensure the go install bin dir is on PATH for `just dev` (dev.sh
        # hard-fails if `air` is missing). setup-go usually adds this, but
        # make it explicit so the e2e job never silently can't find air.
        # Unconditional — the cache-hit path needs it too.
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Cache the Playwright chromium download. `playwright install` inside
      # `just setup` skips the download when the browser is already present.
      # restore-keys lets an unrelated dep bump reuse the previous browsers.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Set up project (deps, playwright chromium, .env.local)
        run: just setup

      - name: Run e2e tests (shard ${{ matrix.shard }}/4)
        # Two rigs per shard (scripts/test-e2e.sh multi-rig lane). Two, not
        # more: each rig is a Chromium + Vite + Go trio and the suite's timing
        # gates already feel runner contention; more workers than that on a
        # 4-vCPU runner would trade wall-clock for flakes.
        env:
          RK_E2E_WORKERS: 2
        run: just test-e2e --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            app/frontend/playwright-report/
            app/frontend/test-results/
          retention-days: 7

  # The desktop shell's own gates: its node --test suite (not covered by any
  # other job) and the Electron e2e lane (just test-desktop-e2e — one rig,
  # xvfb). The launcher passes --no-sandbox because ubuntu-latest restricts
  # unprivileged user namespaces, which breaks Chromium's SUID-less sandbox;
  # that flag is test-only and never reaches dev-desktop or packaging.
  desktop:
    name: Desktop (node --test + electron e2e)
    # Pinned below ubuntu-latest: that label now resolves to Ubuntu 26.04, where
    # the Playwright in app/frontend (1.59.1) refuses to install chromium and its
    # system deps (`Playwright does not support chromium on ubuntu26.04-x64`),
    # failing `just setup` before any test runs. Move back to ubuntu-latest
    # when the Playwright pin supports the newer image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/backend/go.mod

      # pnpm must be installed before setup-node so its `cache: pnpm` can
      # resolve the store path.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          package_json_file: app/desktop/package.json

      # Node 22, not the other jobs' 20: app/desktop declares engines.node
      # >=22.12.0 (release.yml's desktop jobs run 22), and `pnpm test` is
      # `node --test "dist/**/*.test.js"` — Node 20's runner takes no glob
      # and exits 1 with "Could not find …/dist/**/*.test.js".
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml

      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3

      - name: Install tmux
        # apt has no network timeout by default — a stalled mirror connection
        # (the recurring azure.archive.ubuntu.com flake) hangs this step until
        # the 360-minute job timeout. Bound the step and give apt explicit
        # fetch timeouts + retries so a mirror stall fails in minutes and a
        # re-run recovers.
        timeout-minutes: 5
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y tmux

      # The air binary only changes when its pinned version does — cache it to
      # skip the ~17s source build. Bump the key together with the version in
      # the install step below.
      - name: Cache air binary
        id: cache-air
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin/air
          key: air-v1.61.7-${{ runner.os }}

      - name: Install air (backend live-reload used by `just dev`)
        if: steps.cache-air.outputs.cache-hit != 'true'
        run: |
          # Pin to the last air release that targets go 1.23 (the repo's
          # toolchain). @latest pulls a build requiring go >= 1.25, which
          # silently triggers a toolchain download and drifts from go.mod.
          go install github.com/air-verse/air@v1.61.7

      - name: Add go bin dir to PATH
        # Ensure the go install bin dir is on PATH for `just dev` (dev.sh
        # hard-fails if `air` is missing). setup-go usually adds this, but
        # make it explicit so the e2e job never silently can't find air.
        # Unconditional — the cache-hit path needs it too.
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Cache the Playwright chromium download. `playwright install` inside
      # `just setup` skips the download when the browser is already present.
      # restore-keys lets an unrelated dep bump reuse the previous browsers.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The rig the desktop lane drives is the web harness's: Vite + the Go
      # backend + Chromium come from the same `just setup` the e2e job runs.
      - name: Set up project (deps, playwright chromium, .env.local)
        run: just setup

      - name: Install desktop dependencies
        run: cd app/desktop && pnpm install --frozen-lockfile

      - name: Compile + run desktop unit tests
        run: cd app/desktop && pnpm run compile && pnpm test

      - name: Run desktop e2e lane
        run: xvfb-run -a just test-desktop-e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-desktop
          path: |
            app/desktop/playwright-report/
            app/desktop/test-results/
          retention-days: 7

  # Single stable-named aggregate gate for branch-protection / rulesets to
  # require. The individual jobs above have names that are fine to require
  # directly EXCEPT the e2e matrix, whose names (`E2E (shard N/4)`) are coupled
  # to the shard count — requiring those by name would silently break the gate
  # if the matrix ever changes. Requiring this one job instead decouples the
  # ruleset from the job topology: changing the shard count needs no ruleset
  # edit, because the matrix's aggregate result still surfaces as `needs.e2e`.
  #
  # Hard gates = backend + frontend + e2e + code-bridge + desktop (all five required). The e2e job had
  # its `continue-on-error: true` removed so a failing shard actually fails the
  # job (and thus this gate) — given e2e's known CI flakiness, admin bypass on
  # the main ruleset is the intended escape hatch for overriding a known-flake.
  #
  # `if: always()` is REQUIRED: without it this job is *skipped* when a
  # dependency fails, and GitHub treats a skipped required check as passing —
  # which would defeat the gate. With `always()` the job runs regardless, and
  # the explicit result checks below fail it unless every dependency succeeded.
  # For the e2e matrix, `needs.e2e.result` is the AGGREGATE: it is 'success'
  # only when every shard succeeded, 'failure' if any shard failed — so one
  # check covers all shards.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, code-bridge, desktop]
    if: ${{ always() }}
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "backend     = ${{ needs.backend.result }}"
          echo "frontend    = ${{ needs.frontend.result }}"
          echo "e2e         = ${{ needs.e2e.result }}"
          echo "code-bridge = ${{ needs.code-bridge.result }}"
          echo "desktop     = ${{ needs.desktop.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ] || \
             [ "${{ needs.code-bridge.result }}" != "success" ] || \
             [ "${{ needs.desktop.result }}" != "success" ]; then
            echo "::error::A required CI job did not succeed — blocking merge."
            exit 1
          fi
          echo "All required CI jobs succeeded."
